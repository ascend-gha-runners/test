name: e2e-feature-rustup-cache
# 验证特性：Rust / rustup 缓存服务（Port 8082）
# 文档来源：https://ascend-gha-runners.github.io/docs/feature/#rust-rustup-cache-port-8082
# 真实项目使用方式（参考 vllm-project/vllm-ascend CI 与 Dockerfile 构建）：
# 1. 配置环境变量：
#    RUSTUP_DIST_SERVER: http://cache-service...:8082/rustup
#    RUSTUP_UPDATE_ROOT: http://cache-service...:8082/rustup/rustup
# 2. 下载并执行 rustup 安装工具链：
#    curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
#    或通过缓存路径直拉 rustup-init
# 3. 验证 rustc 与 cargo 执行与环境连通

on:
  workflow_dispatch:
    inputs:
      cluster:
        description: "目标集群 (all / gy-001 / wlcb-001 / sz-lab / gy-003 / gy-004 / gy-005 / gy-006 / cn12-001 / sh-001 / sh-002 / hk-001 / aiframework / mind-third-ci)"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - gy-001
          - wlcb-001
          - sz-lab
          - gy-003
          - gy-004
          - gy-005
          - gy-006
          - cn12-001
          - sh-001
          - sh-002
          - hk-001
          - aiframework
          - mind-third-ci
      runner_type:
        description: "Runner 类型 (all / cpu / npu)"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - cpu
          - npu
      cache_host:
        description: "集群内网 nginx-pypi-cache 服务域名"
        required: false
        default: "cache-service.nginx-pypi-cache.svc.cluster.local"
        type: string

jobs:
  matrix-setup:
    name: 解析集群 Runner 矩阵
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      count: ${{ steps.set-matrix.outputs.count }}
    steps:
      - name: 检出测试仓库
        uses: actions/checkout@v4

      - name: 解析 runners.json
        id: set-matrix
        run: |
          python3 -c '
          import json, os, sys

          config_file = ".github/config/runners.json"
          with open(config_file, "r") as fp:
              data = json.load(fp)

          runners = data.get("runners", [])
          target_cluster = "${{ inputs.cluster }}"
          target_type = "${{ inputs.runner_type }}"

          selected = []
          for r in runners:
              if target_cluster != "all":
                  if r.get("cluster") != target_cluster and not (target_cluster in ("wlcb", "wlcb-001") and r.get("cluster") in ("wlcb", "wlcb-001")):
                      continue
              if target_type != "all" and r.get("type") != target_type:
                  continue
              selected.append(r)

          if not selected and target_cluster != "all":
              for r in runners:
                  if r.get("cluster") == target_cluster or (target_cluster in ("wlcb", "wlcb-001") and r.get("cluster") in ("wlcb", "wlcb-001")):
                      selected.append(r)

          if not selected:
              print(f"Error: No runners matched filter (cluster={target_cluster}, type={target_type})", file=sys.stderr)
              sys.exit(1)

          matrix_json = json.dumps({"include": selected})
          print(f"Selected {len(selected)} runners: {matrix_json}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as gh_out:
              gh_out.write(f"matrix={matrix_json}\n")
              gh_out.write(f"count={len(selected)}\n")
          '

  run-rustup-cache-e2e:
    name: "${{ matrix.name }} [${{ matrix.cluster }}]"
    needs: matrix-setup
    runs-on: ${{ matrix.labels }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix-setup.outputs.matrix) }}
    container:
      image: swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/cann:8.2.rc1.alpha003-910b-openeuler22.03-py3.11
    env:
      CACHE_HOST: ${{ inputs.cache_host }}
      RUSTUP_DIST_SERVER: http://${{ inputs.cache_host }}:8082/rustup
      RUSTUP_UPDATE_ROOT: http://${{ inputs.cache_host }}:8082/rustup/rustup
      CARGO_HOME: /root/.cargo
      RUSTUP_HOME: /root/.rustup
    steps:
      - name: 基础环境与节点信息
        run: |
          echo "=== 节点信息 ==="
          echo "Cluster: ${{ matrix.cluster }}"
          echo "Runner:  ${{ matrix.name }}"
          echo "Arch:    $(uname -m)"

      - name: 1. 探测内网 Rustup 缓存端口（8082）连通性
        run: |
          echo "=== 探测 Rustup 缓存路径 ==="
          curl -sI --max-time 15 "${RUSTUP_UPDATE_ROOT}/rustup-init.sh" | head -n 15

      - name: 2. 经内网缓存下载 rustup-init 安装器（模拟 vLLM-Ascend CI）
        run: |
          echo "=== 下载 rustup-init.sh 来自内网缓存 ==="
          curl -fsSL "${RUSTUP_UPDATE_ROOT}/rustup-init.sh" -o /tmp/rustup-init.sh
          # 针对内网 HTTP 源调整参数
          sed -i "s/--proto '=https'//g; s/--https-only//g" /tmp/rustup-init.sh
          head -n 20 /tmp/rustup-init.sh

      - name: 3. 经内网缓存真实安装 Rust 极简稳定工具链
        run: |
          echo "=== 执行 rustup 极简安装 ==="
          sh /tmp/rustup-init.sh -y --default-toolchain stable --profile minimal --no-modify-path
          echo "PATH=/root/.cargo/bin:$PATH" >> $GITHUB_ENV

      - name: 4. 验证 rustc 与 cargo 工具链版本及计算能力
        run: |
          export PATH="/root/.cargo/bin:$PATH"
          echo "=== 验证 Rust 工具链执行 ==="
          rustc --version
          cargo --version
          rustc -e 'fn main() { println!("✓ Rust compute test via port 8082 mirror passed!"); }' -o /tmp/rust_test
          /tmp/rust_test
          echo "✓ Rust/rustup Cache (Port 8082) feature verified successfully on ${{ matrix.cluster }}!"
