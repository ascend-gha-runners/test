name: arc-fedsched e2e (lab)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: linux-aarch64-310p-2-lab
    timeout-minutes: 15
    container:
      image: swr.cn-north-12.myhuaweicloud.com/atlas_inference/cann:9.2.0_20260928212200-310p-ubuntu22.04-py3.12
    steps:
      - name: where am i
        run: |
          echo "runner=$RUNNER_NAME"
          echo "job_pod=$POD_NAME namespace=$POD_NAMESPACE node=$NODE_NAME"
          echo "k8s_service_host=$KUBERNETES_SERVICE_HOST:$KUBERNETES_SERVICE_PORT"
          echo "pod_ips=$(hostname -I 2>/dev/null || true)"
          echo "hostname=$(hostname)"

      - name: hello
        run: |
          echo "runner=$RUNNER_NAME"
          echo "os=$RUNNER_OS arch=$RUNNER_ARCH"
          uname -a
          nproc
          echo "arc-fedsched lab ok"

      - name: npu info
        run: |
          set +e
          echo "=== command -v npu-smi ==="
          command -v npu-smi
          echo "=== npu-smi info ==="
          npu-smi info
          echo "npu-smi exit=$?"
          echo "=== npu-smi info -t board ==="
          npu-smi info -t board
          echo "board exit=$?"
          echo "=== davinci devices ==="
          ls -l /dev/davinci* /dev/davinci_manager /dev/hisi_hdc 2>&1
          echo "=== Ascend driver version ==="
          cat /usr/local/Ascend/driver/version.info 2>&1
          echo "=== CANN version ==="
          cat /usr/local/Ascend/ascend-toolkit/latest/version.cfg 2>&1
          echo "npu probe done"
