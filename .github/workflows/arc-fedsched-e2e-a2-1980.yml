name: arc-fedsched e2e (a2-1980)

# 联邦 runner 烟测：单 scale set linux-aarch64-a2-1-fed（1 卡档）由 arc-fedsched
# dispatcher 在 ascend-hk-001 / karc / wlcb-001 / gy-001 四家成员之间动态分配。
# 落点是动态的，所以这里只写一个标签，不能用 [型号, 集群] 双标签把集群钉死；
# 判断落到哪个集群，看作业打印的 pod 名 / node 名，以及 CP 上的 ResourceBinding。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fanout:
    strategy:
      fail-fast: false
      matrix:
        task: [1, 2, 3, 4]
    runs-on: linux-aarch64-a2-1-fed
    timeout-minutes: 30
    container:
      # A2（910B）CANN 镜像；job 容器的资源（1 张 910B）由成员侧 pod-templates
      # ConfigMap（linux-aarch64-a2-1-fed）套用，本字段只提供 image。
      image: swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/cann:8.2.rc1.alpha003-910b-openeuler22.03-py3.11
    steps:
      - name: 【信息项】where am i
        run: |
          {
            echo "task=${{ matrix.task }}"
            echo "pod=${POD_NAMESPACE:-?}/${POD_NAME:-?}"
            echo "node=${NODE_NAME:-?}"
            echo "pod_ip=$(hostname -I 2>/dev/null | awk '{print $1}')"
            echo "arch=$(uname -m)"
            echo "cpus=$(nproc)"
            echo "--- npu-smi info ---"
            npu-smi info
          } | tee /tmp/probe-${{ matrix.task }}.txt

      - name: 【硬断言】NPU 设备可用
        run: |
          set -euo pipefail
          if [ ! -c /dev/davinci_manager ]; then
            echo "::error::未发现 /dev/davinci_manager，job 容器没有拿到 NPU 设备"
            exit 1
          fi
          npu-smi info >/dev/null
          echo "npu-smi info OK"

      - name: 【软断言】本任务分到 1 张卡
        continue-on-error: true
        run: |
          set -euo pipefail
          chips=$(npu-smi info 2>/dev/null | grep -cE '^\| [0-9]+ +[0-9]+[A-Za-z]+ +\|' || true)
          echo "detected_npu_rows=${chips} (expected 1)"
          if [ "${chips}" != "1" ]; then
            echo "::warning::npu-smi 芯片行数为 ${chips}，期望 1；请人工确认卡数"
          fi

      - name: 【信息项】squid 代理链路
        continue-on-error: true
        run: |
          echo "HTTP_PROXY=${HTTP_PROXY:-<empty>}"
          curl -sS -o /dev/null -w 'via-proxy https://pypi.org/simple/ -> %{http_code}\n' \
            -x "${HTTP_PROXY:-http://squid-cache.squid.svc.cluster.local:3128}" \
            https://pypi.org/simple/ || echo "::warning::经 squid 访问 pypi 失败（仅信息项）"

      - name: upload probe result
        uses: actions/upload-artifact@v4
        with:
          name: probe-${{ matrix.task }}
          path: /tmp/probe-${{ matrix.task }}.txt
          retention-days: 1

  summary:
    needs: [fanout]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: summary
        run: |
          {
            echo "### arc-fedsched a2-1980 分配结果"
            echo
            echo "| task | pod | node | pod ip | arch | cpus | NPUs |"
            echo "|---|---|---|---|---|---|---|"
            for f in artifacts/probe-*/probe-*.txt; do
              [ -f "$f" ] || continue
              task=$(grep '^task=' "$f" | cut -d= -f2)
              pod=$(grep '^pod=' "$f" | cut -d= -f2-)
              node=$(grep '^node=' "$f" | cut -d= -f2-)
              ip=$(grep '^pod_ip=' "$f" | cut -d= -f2-)
              arch=$(grep '^arch=' "$f" | cut -d= -f2-)
              cpus=$(grep '^cpus=' "$f" | cut -d= -f2-)
              npus=$(grep -cE '^\| [0-9]+ +[0-9]+[A-Za-z]+ +\|' "$f" || true)
              echo "| $task | $pod | $node | $ip | $arch | $cpus | $npus |"
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"
