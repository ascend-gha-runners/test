name: e2e-scan-pytorch-metadata
# PyTorch Simple Index 全包 PEP 658 Metadata 完整性扫描 E2E 测试
# 针对 pytorch/pytorch#197552 问题：
# 默认跨所有集群并发执行，测试各集群独立部署的 nginx-pypi-cache 缓存健康度：
# 校验：
#   1. SHA-256 校验和一致性（对比 data-dist-info-metadata="sha256=..."）
#   2. 是否残留 Checksum-SHA256: 尾部破坏行
#   3. RFC 822 元数据格式规范（Metadata-Version, Name 等）
#   4. 各集群代理缓存命中与全量无损回放
on:
  schedule:
    # 每天 UTC 00:00（北京时间 08:00）全量检查 CPU wheel 缓存。
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      cluster:
        description: "选择目标集群 (默认 all: 测试所有集群缓存健康)"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - gy-001
          - wlcb-001
          - sz-lab
          - gy-003
          - gy-004
          - gy-005
          - gy-006
          - cn12-001
          - sh-001
          - sh-002
          - hk-001
          - aiframework
          - mind-third-ci
      runner_type:
        description: "选择 Runner 类型 (cpu / npu / all)"
        required: false
        default: "cpu"
        type: choice
        options:
          - cpu
          - npu
          - all
      index_url:
        description: "PyTorch Simple Index 仓库地址 (支持集群内网缓存服务或官方源)"
        required: false
        default: "http://cache-service.nginx-pypi-cache.svc.cluster.local/whl/cpu"
        type: string
      scan_mode:
        description: "扫描模式 (sample: 每包采样 / all: 全量历史 wheel 扫描 / single: 指定单包)"
        required: false
        default: "all"
        type: choice
        options:
          - sample
          - all
          - single
      sample_per_pkg:
        description: "采样模式下每个包抽检的最新 wheel 数量 (默认 5)"
        required: false
        default: "5"
        type: string
      package:
        description: "指定单包模式下的包名 (如 torch, torchvision)"
        required: false
        default: ""
        type: string
      concurrency:
        description: "并发扫描线程数 (默认 16)"
        required: false
        default: "16"
        type: string

jobs:
  matrix-setup:
    name: 动态解析测试矩阵
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      count: ${{ steps.set-matrix.outputs.count }}
    steps:
      - name: 检出测试代码
        uses: actions/checkout@v4

      - name: 解析 runners.json
        id: set-matrix
        run: |
          python3 -c '
          import json, os, sys

          config_file = ".github/config/runners.json"
          with open(config_file, "r") as fp:
              data = json.load(fp)

          runners = data.get("runners", [])
          target_cluster = "${{ inputs.cluster || 'gy-006' }}"
          target_type = "${{ inputs.runner_type || 'cpu' }}"

          selected = []
          for r in runners:
              if target_cluster != "all":
                  if r.get("cluster") != target_cluster and not (target_cluster in ("wlcb", "wlcb-001") and r.get("cluster") in ("wlcb", "wlcb-001")):
                      continue
              if target_type != "all" and r.get("type") != target_type:
                  continue
              selected.append(r)

          if not selected and target_cluster != "all":
              for r in runners:
                  if r.get("cluster") == target_cluster or (target_cluster in ("wlcb", "wlcb-001") and r.get("cluster") in ("wlcb", "wlcb-001")):
                      selected.append(r)

          if not selected:
              print(f"Error: No runners matched filter (cluster={target_cluster}, type={target_type})", file=sys.stderr)
              sys.exit(1)

          matrix_json = json.dumps({"include": selected})
          print(f"Matrix selected ({len(selected)} runners across clusters): {matrix_json}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as gh_out:
              gh_out.write(f"matrix={matrix_json}\n")
              gh_out.write(f"count={len(selected)}\n")
          '

  scan-pytorch-metadata:
    name: "Scan [${{ matrix.cluster }}] ${{ matrix.name }}"
    needs: matrix-setup
    runs-on: ${{ matrix.labels }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix-setup.outputs.matrix) }}
    container:
      image: swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/cann:8.2.rc1.alpha003-910b-openeuler22.03-py3.11
    env:
      # Scheduled runs have no workflow_dispatch inputs; keep their target
      # identical to the manual defaults.
      INDEX_URL: ${{ inputs.index_url || 'http://cache-service.nginx-pypi-cache.svc.cluster.local/whl/cpu' }}
      SCAN_MODE: ${{ inputs.scan_mode || 'all' }}
      CONCURRENCY: ${{ inputs.concurrency || '16' }}
      SAMPLE_PER_PKG: ${{ inputs.sample_per_pkg || '5' }}
      PACKAGE: ${{ inputs.package || '' }}
    steps:
      - name: 检出测试代码
        uses: actions/checkout@v4

      - name: 环境与连通性诊断
        run: |
          echo "=== 节点架构与内核 [${{ matrix.cluster }}] ==="
          uname -a
          python3 --version

          echo -e "\n=== 目标源连通性检查 ==="
          curl -s -I --connect-timeout 5 "$INDEX_URL/" | head -n 10 || echo "Target index connection check done"

      - name: 执行 PyTorch 全包 PEP 658 Metadata 扫描
        id: scan
        run: |
          SCAN_ARGS="--index-url $INDEX_URL \
            --concurrency $CONCURRENCY \
            --cluster ${{ matrix.cluster }} \
            --runner-name ${{ matrix.name }} \
            --output-json scan_report_${{ matrix.name }}.json"

          if [ "$SCAN_MODE" = "all" ]; then
            SCAN_ARGS="$SCAN_ARGS --all"
          elif [ "$SCAN_MODE" = "single" ]; then
            SCAN_ARGS="$SCAN_ARGS --package $PACKAGE"
          else
            SCAN_ARGS="$SCAN_ARGS --sample-per-pkg $SAMPLE_PER_PKG"
          fi

          echo "Running scanner: python3 scripts/scan_pytorch_index_metadata.py $SCAN_ARGS"
          python3 scripts/scan_pytorch_index_metadata.py $SCAN_ARGS

      - name: 上传扫描报告 Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-report-${{ matrix.name }}
          path: scan_report_${{ matrix.name }}.json
          retention-days: 7

  aggregate-summary:
    name: 跨集群缓存健康汇总
    needs: [matrix-setup, scan-pytorch-metadata]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 检出测试代码
        uses: actions/checkout@v4

      - name: 下载各集群扫描报告
        uses: actions/download-artifact@v4
        with:
          pattern: scan-report-*
          path: reports

      - name: 汇总多集群健康结果
        run: |
          python3 scripts/aggregate_cluster_reports.py --reports-dir reports
