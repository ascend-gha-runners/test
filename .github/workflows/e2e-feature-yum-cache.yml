name: e2e-feature-yum-cache
# 验证特性：YUM / DNF 缓存服务（Port 8083）
# 文档来源：https://ascend-gha-runners.github.io/docs/feature/#yum-dnf-cache-port-8083
# 真实项目使用方式（参考 vllm-project/vllm-ascend CI openEuler 依赖安装）：
# 1. 配置 YUM 镜像源：
#    sed -i 's|https://repo.openeuler.org|http://cache-service...:8083|g' /etc/yum.repos.d/*.repo
#    sed -Ei 's@https?://[^/]+/(openeuler|centos|fedora)@http://cache-service...:8083/\1@g' /etc/yum.repos.d/*.repo
# 2. 真实元数据刷新与安装：
#    dnf clean all && dnf makecache
#    dnf install -y git zstd
# 3. 验证软件包二进制版本与执行

on:
  schedule:
    # 每天 UTC 19:00（北京时间 03:00，凌晨错峰）全集群 YUM/DNF 缓存（Port 8083）验证
    - cron: "0 19 * * *"
  workflow_dispatch:
    inputs:
      cluster:
        description: "目标集群 (all / gy-001 / wlcb-001 / sz-lab / gy-003 / gy-004 / gy-005 / gy-006 / cn12-001 / sh-001 / sh-002 / hk-001 / aiframework / mind-third-ci)"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - gy-001
          - wlcb-001
          - sz-lab
          - gy-003
          - gy-004
          - gy-005
          - gy-006
          - cn12-001
          - sh-001
          - sh-002
          - hk-001
          - aiframework
          - mind-third-ci
      runner_type:
        description: "Runner 类型 (all / cpu / npu)"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - cpu
          - npu
      cache_host:
        description: "集群内网 nginx-pypi-cache 服务域名"
        required: false
        default: "cache-service.nginx-pypi-cache.svc.cluster.local"
        type: string

jobs:
  matrix-setup:
    name: 解析集群 Runner 矩阵
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      count: ${{ steps.set-matrix.outputs.count }}
    steps:
      - name: 检出测试仓库
        uses: actions/checkout@v4

      - name: 解析 runners.json
        id: set-matrix
        run: |
          python3 -c '
          import json, os, sys

          config_file = ".github/config/runners.json"
          with open(config_file, "r") as fp:
              data = json.load(fp)

          runners = data.get("runners", [])
          target_cluster = "${{ inputs.cluster || 'all' }}"
          target_type = "${{ inputs.runner_type || 'all' }}"

          selected = []
          for r in runners:
              if target_cluster != "all":
                  if r.get("cluster") != target_cluster and not (target_cluster in ("wlcb", "wlcb-001") and r.get("cluster") in ("wlcb", "wlcb-001")):
                      continue
              if target_type != "all" and r.get("type") != target_type:
                  continue
              selected.append(r)

          if not selected and target_cluster != "all":
              for r in runners:
                  if r.get("cluster") == target_cluster or (target_cluster in ("wlcb", "wlcb-001") and r.get("cluster") in ("wlcb", "wlcb-001")):
                      selected.append(r)

          if not selected:
              print(f"Error: No runners matched filter (cluster={target_cluster}, type={target_type})", file=sys.stderr)
              sys.exit(1)

          matrix_json = json.dumps({"include": selected})
          print(f"Selected {len(selected)} runners: {matrix_json}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as gh_out:
              gh_out.write(f"matrix={matrix_json}\n")
              gh_out.write(f"count={len(selected)}\n")
          '

  run-yum-cache-e2e:
    name: "${{ matrix.name }} [${{ matrix.cluster }}]"
    needs: matrix-setup
    runs-on: ${{ matrix.labels }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix-setup.outputs.matrix) }}
    container:
      image: swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/cann:8.2.rc1.alpha003-910b-openeuler22.03-py3.11
    env:
      CACHE_HOST: ${{ inputs.cache_host || 'cache-service.nginx-pypi-cache.svc.cluster.local' }}
    steps:
      - name: 基础环境与操作系统诊断
        run: |
          echo "=== 节点信息 ==="
          echo "Cluster: ${{ matrix.cluster }}"
          echo "Runner:  ${{ matrix.name }}"
          echo "Arch:    $(uname -m)"
          cat /etc/os-release | grep PRETTY_NAME || true

      - name: 1. 探测内网 YUM 缓存端口（8083）连通性
        run: |
          echo "=== 探测 YUM 缓存服务 (8083) ==="
          curl -sI --connect-timeout 5 "http://${CACHE_HOST}:8083" || echo "Note: Port 8083 root path probed, continuing to repository test"

      - name: 2. 按照文档与 vLLM-Ascend 规范重写 YUM 源配置
        run: |
          echo "=== 替换 /etc/yum.repos.d/*.repo 为 8083 缓存端口 ==="
          sed -i "s|https://repo.openeuler.org|http://${CACHE_HOST}:8083|g" /etc/yum.repos.d/*.repo || true
          sed -Ei "s@https?://[^/]+/(openeuler|centos|fedora)@http://${CACHE_HOST}:8083/\\1@g" /etc/yum.repos.d/*.repo || true
          echo "=== 检查修改后的 yum 源 ==="
          grep -E "${CACHE_HOST}:8083" /etc/yum.repos.d/*.repo | head -n 10

      - name: 3. 经内网缓存真实执行 makecache
        run: |
          echo "=== 刷新包管理器缓存 ==="
          dnf clean all || yum clean all
          dnf makecache || yum makecache

      - name: 4. 经内网缓存真实安装软件包（vLLM-Ascend 构建依赖）
        run: |
          echo "=== 安装 git 与 zstd ==="
          dnf install -y git zstd || yum install -y git zstd

      - name: 5. 验证已安装工具执行与版本
        run: |
          echo "=== 验证安装结果 ==="
          git --version
          zstd --version
          echo "✓ YUM/DNF Cache 8083 feature verified successfully on ${{ matrix.cluster }} (${{ matrix.name }})!"
