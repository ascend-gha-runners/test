name: e2e-feature-pypi-cache
# 验证特性：PyPI 缓存服务（Port 80）与 PyTorch Wheels 缓存（/whl 路径）
# 文档来源：https://ascend-gha-runners.github.io/docs/feature/#pypi-cache-port-80
# 真实项目使用方式（参考 vllm-project/vllm-ascend CI 工作流与 Dockerfile）：
# 1. 配置 pip 镜像源：
#    pip config set global.index-url http://cache-service.../pypi/simple
#    pip config set global.trusted-host cache-service...
#    pip config set global.no-cache-dir true
# 2. 环境变量配置：
#    PIP_INDEX_URL, PIP_TRUSTED_HOST, UV_INDEX_URL, UV_INSECURE_HOST, UV_NO_CACHE=1
# 3. 真实包安装：pip + uv 安装 uc-manager, uv, triton-ascend
# 4. PyTorch wheels 镜像缓存：/whl/cpu 路径真实安装
# 5. 404 回退机制：未同步包自动回源到 pypi.org

on:
  schedule:
    # 每天 UTC 17:30（北京时间 01:30，凌晨错峰）全集群 PyPI 缓存与 PyTorch Wheel 验证
    - cron: "30 17 * * *"
  workflow_dispatch:
    inputs:
      cluster:
        description: "目标集群 (all / gy-001 / wlcb-001 / sz-lab / gy-003 / gy-004 / gy-005 / gy-006 / cn12-001 / sh-001 / sh-002 / hk-001 / aiframework / mind-third-ci)"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - gy-001
          - wlcb-001
          - sz-lab
          - gy-003
          - gy-004
          - gy-005
          - gy-006
          - cn12-001
          - sh-001
          - sh-002
          - hk-001
          - aiframework
          - mind-third-ci
      runner_type:
        description: "Runner 类型 (all / cpu / npu)"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - cpu
          - npu
      cache_host:
        description: "集群内网 nginx-pypi-cache 服务域名"
        required: false
        default: "cache-service.nginx-pypi-cache.svc.cluster.local"
        type: string
      torch_version:
        description: "PyTorch CPU 目标版本（例如 2.4.0，不含 +cpu）"
        required: false
        default: "2.4.0"
        type: string
      verify_wheel_bytes:
        description: "人工执行时额外抽样校验 torch 与依赖 wheel 字节 SHA-256（包含大文件下载）"
        required: false
        default: true
        type: boolean
      triton_version:
        description: "triton-ascend 目标版本"
        required: false
        default: "3.2.2"
        type: string

jobs:
  matrix-setup:
    name: 解析集群 Runner 矩阵
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      count: ${{ steps.set-matrix.outputs.count }}
    steps:
      - name: 检出测试仓库
        uses: actions/checkout@v4

      - name: 解析 runners.json
        id: set-matrix
        run: |
          python3 -c '
          import json, os, sys

          config_file = ".github/config/runners.json"
          with open(config_file, "r") as fp:
              data = json.load(fp)

          runners = data.get("runners", [])
          target_cluster = "${{ inputs.cluster || 'all' }}"
          target_type = "${{ inputs.runner_type || 'all' }}"

          selected = []
          for r in runners:
              if target_cluster != "all":
                  if r.get("cluster") != target_cluster and not (target_cluster in ("wlcb", "wlcb-001") and r.get("cluster") in ("wlcb", "wlcb-001")):
                      continue
              if target_type != "all" and r.get("type") != target_type:
                  continue
              selected.append(r)

          # 若指定集群但按 runner_type 无结果（如纯 NPU 集群选择了 cpu），则自动回退到该集群可用节点
          if not selected and target_cluster != "all":
              for r in runners:
                  if r.get("cluster") == target_cluster or (target_cluster in ("wlcb", "wlcb-001") and r.get("cluster") in ("wlcb", "wlcb-001")):
                      selected.append(r)

          if not selected:
              print(f"Error: No runners matched filter (cluster={target_cluster}, type={target_type})", file=sys.stderr)
              sys.exit(1)

          matrix_json = json.dumps({"include": selected})
          print(f"Selected {len(selected)} runners: {matrix_json}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as gh_out:
              gh_out.write(f"matrix={matrix_json}\n")
              gh_out.write(f"count={len(selected)}\n")
          '

  run-pypi-cache-e2e:
    name: "${{ matrix.name }} [${{ matrix.cluster }}]"
    needs: matrix-setup
    runs-on: ${{ matrix.labels }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix-setup.outputs.matrix) }}
    container:
      image: swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/cann:8.2.rc1.alpha003-910b-openeuler22.03-py3.11
    env:
      CACHE_HOST: ${{ inputs.cache_host || 'cache-service.nginx-pypi-cache.svc.cluster.local' }}
      INDEX_URL: http://${{ inputs.cache_host || 'cache-service.nginx-pypi-cache.svc.cluster.local' }}/pypi/simple
      ASCEND_URL: http://${{ inputs.cache_host || 'cache-service.nginx-pypi-cache.svc.cluster.local' }}/ascend/repos/pypi
      WHL_URL: http://${{ inputs.cache_host || 'cache-service.nginx-pypi-cache.svc.cluster.local' }}/whl/cpu
      PIP_INDEX_URL: http://${{ inputs.cache_host || 'cache-service.nginx-pypi-cache.svc.cluster.local' }}/pypi/simple
      PIP_TRUSTED_HOST: ${{ inputs.cache_host || 'cache-service.nginx-pypi-cache.svc.cluster.local' }}
      UV_INDEX_URL: http://${{ inputs.cache_host || 'cache-service.nginx-pypi-cache.svc.cluster.local' }}/pypi/simple
      UV_EXTRA_INDEX_URL: http://${{ inputs.cache_host || 'cache-service.nginx-pypi-cache.svc.cluster.local' }}/ascend/repos/pypi http://${{ inputs.cache_host || 'cache-service.nginx-pypi-cache.svc.cluster.local' }}/whl/cpu
      UV_INSECURE_HOST: ${{ inputs.cache_host || 'cache-service.nginx-pypi-cache.svc.cluster.local' }}
      UV_INDEX_STRATEGY: unsafe-best-match
      UV_HTTP_TIMEOUT: 120
      UV_NO_CACHE: 1
      UV_SYSTEM_PYTHON: 1
      TORCH_VERSION: ${{ inputs.torch_version || '2.4.0' }}
      TRITON_VERSION: ${{ inputs.triton_version || '3.2.2' }}
    defaults:
      run:
        shell: bash
    steps:
      - name: 配置 Git 镜像代理 (加速 GitHub 访问)
        run: |
          git config --global url."https://gh-proxy.test.osinfra.cn/https://github.com/".insteadOf https://github.com/ || true

      - name: 检出测试仓库
        uses: actions/checkout@v4

      - name: 基础环境与节点信息
        run: |
          echo "=== 节点信息 ==="
          echo "Cluster: ${{ matrix.cluster }}"
          echo "Runner:  ${{ matrix.name }}"
          echo "Arch:    $(uname -m)"
          echo "Python:  $(python3 --version 2>&1)"
          echo "Pip:     $(python3 -m pip --version 2>&1)"

      - name: 【基础功能】1. 探测内网 PyPI 端点连通性与缓存响应头
        run: |
          echo "=== 探测 PyPI Simple 路径与 X-Pypi-Cache 头 ==="
          headers=$(mktemp)
          trap 'rm -f "$headers"' EXIT
          status=$(curl -sS --max-time 45 -o /dev/null -D "$headers" -w '%{http_code}' "${INDEX_URL}/pip/")
          head -n 20 "$headers"
          test "$status" = 200 || { echo "::error::PyPI index HTTP $status"; exit 1; }
          if grep -iq '^X-Pypi-Cache:' "$headers"; then
            cache_status=$(awk 'tolower($1)=="x-pypi-cache:" {gsub("\r", "", $2); print $2}' "$headers")
            echo "✓ 响应包含缓存标识头: X-Pypi-Cache=${cache_status}"
          else
            echo "::warning::X-Pypi-Cache 未显式返回，缓存头观察未验证"
          fi

      - name: 【用户视角场景】2. 按照真实项目规范配置 pip 与 uv 多源镜像
        run: |
          echo "=== 配置 pip 全局索引指向集群内网多源缓存 (PyPI + Ascend + PyTorch WHL) ==="
          python3 -m pip config set global.index-url "${INDEX_URL}"
          python3 -m pip config set global.extra-index-url "${ASCEND_URL} ${WHL_URL}"
          python3 -m pip config set global.trusted-host "${CACHE_HOST}"
          python3 -m pip config set global.no-cache-dir true
          python3 -m pip config list

      - name: 【用户视角场景】3. 经内网缓存真实安装构建工具 (pip install --no-cache-dir uv uc-manager)
        run: |
          echo "=== 真实安装 uv 与 uc-manager（模拟真实 AI 项目构建环境）==="
          python3 -m pip install --no-cache-dir --force-reinstall uv uc-manager 2>&1 | tee /tmp/pypi-tools-install.log
          if grep -qi "Using cached" /tmp/pypi-tools-install.log; then
            echo "::error::检测到本地缓存命中 (Using cached)，未能完全绕过本地磁盘缓存!"
            exit 1
          fi
          uv --version
          python3 -m pip show uc-manager
          echo "✓ uc-manager and uv installed successfully"

      - name: 【用户视角场景】4. 经内网华为昇腾专属源安装 triton-ascend (vLLM-Ascend 核心依赖)
        run: |
          echo "=== 探测 /ascend/repos/pypi 端点 ==="
          curl -sI --max-time 15 "${ASCEND_URL}/" | head -n 10 || true

          echo "=== 经内网 /ascend/repos/pypi 真实安装 triton-ascend ==="
          env -u UV_INDEX -u UV_DEFAULT_INDEX -u UV_FIND_LINKS \
            uv --no-config pip install --no-cache --force-reinstall --no-deps "triton-ascend==${TRITON_VERSION}"
          python3 -m pip show triton-ascend
          echo "✓ triton-ascend installed successfully via internal ascend repo"

      - name: 【用户视角场景】HTTP wheel/metadata 字节完整性抽样（与宿主架构无关）
        id: wheel-integrity
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_wheel_bytes }}
        run: |
          set +e
          python3 scripts/wheel_integrity_check.py --require-index-origin \
            --sample "${WHL_URL}" "torch==${TORCH_VERSION}+cpu" \
            --sample "${INDEX_URL}" 'filelock==3.16.1' \
            --sample "${INDEX_URL}" 'jinja2==3.1.4' \
            --sample-count 1 --timeout 60 > wheel-integrity.json
          result=$?
          set -e
          cat wheel-integrity.json
          case "$result" in
            0) echo "HTTP wheel samples: pass (torch/filelock/jinja2, one wheel each; not all dependencies)" >> "$GITHUB_STEP_SUMMARY" ;;
            2) echo "::warning::文件完整性缺少样本或公布的 hash，未验证"
               echo "HTTP wheel samples: not_verified (see wheel-integrity.json)" >> "$GITHUB_STEP_SUMMARY" ;;
            *) echo "HTTP wheel samples: fail" >> "$GITHUB_STEP_SUMMARY"; exit "$result" ;;
          esac

      - name: 【用户视角场景】5. 经内网 /whl 路径真实安装 PyTorch CPU (amd64 架构执行，arm64 跳过)
        id: torch-install
        run: |
          arch=$(uname -m)
          if [ "$arch" != "x86_64" ] && [ "$arch" != "amd64" ]; then
            echo "PyTorch CPU install: not_applicable (${arch}, ADR-0002)" >> "$GITHUB_STEP_SUMMARY"
            echo "ℹ 针对 PyTorch 用例跳过 ${arch} (arm64) 架构，PyTorch /whl/cpu 仅在各集群 amd64 节点上测试"
            exit 0
          fi

          echo "=== 探测 /whl/cpu 端点 ==="
          curl -sI --max-time 15 "${WHL_URL}/torch/" | head -n 10 || true

          echo "=== 经内网 /whl 路径真实安装 PyTorch CPU ==="
          # 空 venv 保证 torch 及所有解析到的依赖实际下载，而不是复用系统包。
          uv --no-config venv --no-project --no-python-downloads --python "$(command -v python3)" /tmp/pypi-e2e-torch
          torch_spec="torch==${TORCH_VERSION}+cpu"
          env -u UV_INDEX -u UV_DEFAULT_INDEX -u UV_FIND_LINKS -u UV_INDEX_URL \
            -u UV_EXTRA_INDEX_URL -u UV_SYSTEM_PYTHON \
            uv --no-config pip install --python /tmp/pypi-e2e-torch/bin/python --no-cache \
            "${torch_spec}" --index-url "${WHL_URL}" --extra-index-url "${INDEX_URL}" \
            --index-strategy unsafe-best-match --no-python-downloads
          /tmp/pypi-e2e-torch/bin/python -c "import torch; print(f'✓ PyTorch version: {torch.__version__}, file={torch.__file__}'); assert str(torch.__version__) == __import__('os').environ['TORCH_VERSION'] + '+cpu'; assert torch.ones(2, 2).sum().item() == 4"
          echo "PyTorch CPU install + dependency resolution + tensor: pass" >> "$GITHUB_STEP_SUMMARY"

      - name: 【用户视角场景】6. 真实 Python 运行时多模块导入与计算验证 (torch, triton, uc-manager)
        run: |
          python3 -c "
          import uv, importlib.metadata
          print('=== 综合运行时自检通过 ===')
          print('✓ uv binary:', uv.find_uv_bin())
          print('✓ uv package version:', importlib.metadata.version('uv'))

          import triton
          print('✓ triton loaded:', getattr(triton, '__version__', 'unknown'))

          import platform
          if platform.machine() in ('x86_64', 'amd64'):
              try:
                  import subprocess
                  subprocess.run(['/tmp/pypi-e2e-torch/bin/python', '-c',
                      'import torch; assert torch.ones(2, 2).sum().item() == 4; print(torch.__version__)'], check=True)
                  print('✓ PyTorch isolated CPU tensor compute check passed')
              except Exception as e:
                  print('::error::PyTorch import or tensor computation failed:', e)
                  raise
          else:
              print('ℹ PyTorch import skipped on arm64')

          print('All Python runtime checks passed!')
          "
          python3 -m pip show uv uc-manager triton-ascend

      - name: 【基础功能】7. 验证 404 回源至 pypi.org 回退机制
        id: http-fallback
        run: |
          echo "=== 探测上游 404 回退链路 ==="
          bogus="e2e-nonexistent-pkg-${GITHUB_RUN_ID}"
          headers=$(mktemp)
          trap 'rm -f "$headers"' EXIT
          status=$(curl -sS --max-time 45 -o /dev/null -D "$headers" -w '%{http_code}' "${INDEX_URL}/${bogus}/")
          test "$status" = 404 || { echo "::error::Expected HTTP 404, got $status"; exit 1; }
          tier=$(awk 'tolower($1)=="x-cache-tier:" {gsub("\r", "", $2); print $2}' "$headers")
          echo "PyPI nonexistent package HTTP status: pass (404)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$tier" = "pypi-org" ]; then
            echo "PyPI 404 upstream fallback: pass (pypi-org)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::404 返回正常，但未观察到最终 pypi-org 层，不能证明完整回退链"
            echo "PyPI 404 upstream fallback: not_verified (tier=${tier:-absent})" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "Nginx upstream 5xx/507 fallback: not_verified (no production fault injection)" >> "$GITHUB_STEP_SUMMARY"

      - name: 【基础功能】8. 异常场景：客户端容灾降级 (主源故障自动切换至备用内网缓存)
        id: client-fallback
        run: |
          echo "=== 模拟主索引源不可达，验证 pip extra-index-url 自动容灾 ==="
          target=$(mktemp -d)
          trap 'rm -rf "$target"' EXIT
          # 清空额外源与用户配置，避免系统预装包或其他镜像造成假通过。
          PIP_CONFIG_FILE=/dev/null PIP_EXTRA_INDEX_URL="${INDEX_URL}" \
            python3 -m pip install --no-cache-dir --ignore-installed --target "$target" \
            --index-url "http://127.0.0.1:59999/pypi/simple" \
            --trusted-host 127.0.0.1 --trusted-host "${CACHE_HOST}" \
            --extra-index-url "${INDEX_URL}" --timeout 3 --retries 1 idna==3.10
          PYTHONPATH="$target" python3 -c "import idna; assert idna.__version__ == '3.10'; print('✓ 客户端备用索引真实下载成功')"
          echo "pip client extra-index recovery: pass (not nginx upstream fallback)" >> "$GITHUB_STEP_SUMMARY"

      - name: 保留完整性样本证据
        if: ${{ always() && steps.wheel-integrity.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: wheel-integrity-${{ matrix.name }}
          path: wheel-integrity.json
          if-no-files-found: warn

      - name: 汇总执行状态（跳过不等于通过）
        if: always()
        env:
          WHEEL_OUTCOME: ${{ steps.wheel-integrity.outcome }}
          TORCH_OUTCOME: ${{ steps.torch-install.outcome }}
          HTTP_OUTCOME: ${{ steps.http-fallback.outcome }}
          CLIENT_OUTCOME: ${{ steps.client-fallback.outcome }}
        run: |
          python3 - <<'PY'
          import os, platform
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('\n### PyPI execution evidence\n\n')
              for name in ('WHEEL', 'TORCH', 'HTTP', 'CLIENT'):
                  outcome = os.environ[name + '_OUTCOME']
                  if outcome == 'failure':
                      state = 'fail'
                  elif outcome != 'success':
                      state = 'not_verified'
                  elif name == 'TORCH' and platform.machine() not in ('amd64', 'x86_64'):
                      state = 'not_applicable (ADR-0002)'
                  else:
                      state = 'executed; see detailed assertion result above'
                  out.write(f'- {name}: {state}\n')
              out.write('- nginx upstream 5xx/507: not_verified (deployment-repo mock coverage only)\n')
          PY
