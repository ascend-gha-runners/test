name: test-triton-direct
# 对比：直连 repo.huaweicloud.com(外网CDN) vs 内网 cache-service，定位 triton-ascend==3.6.0.post2 找不到的缓存层

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: linux-amd64-cpu-2
    timeout-minutes: 20
    container:
      image: quay.io/ascend/cann:9.2.1-910b-ubuntu22.04-py3.12
    steps:
      - name: 环境与 DNS
        run: |
          echo "arch=$(uname -m) python=$(python3 --version 2>&1)"
          echo "--- repo.huaweicloud.com DNS ---"
          getent hosts repo.huaweicloud.com || echo "DNS 解析失败"
          echo "--- mirrors.huaweicloud.com DNS ---"
          getent hosts mirrors.huaweicloud.com || echo "DNS 解析失败"
          echo "--- cache-service DNS ---"
          getent hosts cache-service.nginx-pypi-cache.svc.cluster.local || echo "DNS 解析失败"

      - name: 1. 直连 repo.huaweicloud.com 目录页（外网CDN）
        run: |
          echo "=== 响应头 ==="
          curl -sI --max-time 20 https://repo.huaweicloud.com/ascend/repos/pypi/triton-ascend/ | grep -iE 'HTTP|Expires|Last-Modified|via|x-ccdn|Age|X-Cache'
          echo "=== 目录页里 post2 出现次数 ==="
          n=$(curl -s --max-time 20 https://repo.huaweicloud.com/ascend/repos/pypi/triton-ascend/ | grep -c '3.6.0.post2' || true)
          echo "post2 count = $n"
          [ "$n" -gt 0 ] && echo "RESULT: 直连有 post2" || echo "RESULT: 直连无 post2"

      - name: 2. 走内网 cache-service 目录页
        run: |
          echo "=== 响应头 ==="
          curl -sI --max-time 20 http://cache-service.nginx-pypi-cache.svc.cluster.local/ascend/repos/pypi/triton-ascend/ | grep -iE 'HTTP|Expires|Last-Modified|via|x-ccdn|Age|X-Cache|X-Pypi'
          echo "=== 目录页里 post2 出现次数 ==="
          n=$(curl -s --max-time 20 http://cache-service.nginx-pypi-cache.svc.cluster.local/ascend/repos/pypi/triton-ascend/ | grep -c '3.6.0.post2' || true)
          echo "post2 count = $n"
          [ "$n" -gt 0 ] && echo "RESULT: 内网有 post2" || echo "RESULT: 内网无 post2"

      - name: 3. 用直连 CDN 当 extra index 装 triton-ascend==3.6.0.post2（复现 vllm-ascend CI）
        run: |
          pip install uv -q 2>&1 | tail -1
          export UV_SYSTEM_PYTHON=1
          export UV_NO_CACHE=1
          export UV_INDEX_STRATEGY=unsafe-best-match
          export UV_INDEX_URL="http://cache-service.nginx-pypi-cache.svc.cluster.local/pypi/simple"
          export UV_EXTRA_INDEX_URL="https://repo.huaweicloud.com/ascend/repos/pypi http://cache-service.nginx-pypi-cache.svc.cluster.local/whl/cpu/"
          export UV_INSECURE_HOST="cache-service.nginx-pypi-cache.svc.cluster.local"
          echo "=== UV env ==="
          env | grep -i '^UV_' | sort
          echo "=== 安装 triton-ascend==3.6.0.post2 ==="
          uv pip install --no-cache --force-reinstall --no-deps "triton-ascend==3.6.0.post2" 2>&1
          echo "EXIT=$?"
