name: e2e-new-runner
# 新 runner 接入 checklist：job pod 到集群内各基础设施服务的连通性
# 与可用性验证。新 scale set 接入时 dispatch 一次，全绿即放行。
# 覆盖：环境信息 / NPU(可选) / git-cdn / PyPI 缓存(80) / crates 缓存(8085, 可选)
#       / deb(8081) rustup(8082) go(8084) / yum(8083 信息项)
#       / squid 代理(3128) / buildkitd(1234) / vault(8200)
#
# 用法：
#   gh workflow run e2e-new-runner.yml --repo ascend-gha-runners/test \
#     -f runner-label=linux-aarch64-cpu-4 -f check-npu=false
#   NPU 规格：-f check-npu=true；有 crates 缓存的集群：-f check-crates=true
#   amd64 接入：-f container-image=<amd64 镜像>
#
# 注意：runner-label 写错不会报错，job 会一直 Pending 排队直到 timeout；
# 长时间 Pending 先核对 label 与 ascend-ci-deployment 中 scaleSetLabels 是否一致。
on:
  workflow_dispatch:
    inputs:
      runner-label:
        description: '新 runner 能力 label'
        required: true
        default: 'linux-aarch64-cpu-4'
        type: string
      check-npu:
        description: 'NPU 规格勾选：断言 npu-smi 与 davinci 设备在线'
        type: boolean
        default: false
      check-crates:
        description: 'crates.io 缓存勾选：断言 sparse index dl 改写与下载缓存头（非所有集群部署）'
        type: boolean
        default: false
      container-image:
        description: 'job 容器镜像（amd64 runner 接入时传 amd64 镜像）'
        required: true
        default: 'swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/cann:8.2.rc1.alpha003-910b-openeuler22.03-py3.11'
        type: string

jobs:
  checklist:
    # label 写错时本 job 会 Pending 排队而非立即失败
    runs-on: "${{ inputs.runner-label }}"
    timeout-minutes: 60
    container:
      image: ${{ inputs.container-image }}
    env:
      CACHE: cache-service.nginx-pypi-cache.svc.cluster.local
      SQUID: squid-cache.squid.svc.cluster.local:3128
    steps:
      - name: 环境信息（INFO）
        run: |
          echo "runner: $(hostname), arch: $(uname -m)"
          head -2 /etc/os-release || true
          for h in "$CACHE" git-cdn-service.git-cdn.svc.cluster.local \
            squid-cache.squid.svc.cluster.local buildkitd-arm64-service.buildkitd \
            buildkitd-amd64-service.buildkitd vault.vault.svc; do
            ip=$(getent hosts "$h" 2>/dev/null | awk '{print $1}' | head -1)
            echo "INFO: DNS ${h} → ${ip:-解析失败}"
          done
          env | grep -iE '^(https?_proxy|no_proxy)=' || echo "INFO: 容器未注入代理环境变量"

      - name: NPU 在线检查
        if: inputs.check-npu == true
        run: |
          npu-smi info || { echo "FAIL: npu-smi 不可用"; exit 1; }
          got=$(ls /dev/davinci[0-9]* 2>/dev/null | wc -l)
          echo "davinci devices: $got"
          [ "$got" -ge 1 ] || { echo "FAIL: 无 davinci 设备"; exit 1; }
          echo "PASS: NPU 在线（$got 卡）"

      - name: git-cdn（github.com 克隆改写）
        run: |
          # 新 runner 的 pod template 必须注入 insteadOf 改写；缺失时 git 直连
          # github.com，国内节点会挂起，先断言改写存在再克隆
          git config --get-regexp insteadof \
            || { echo "FAIL: 未检测到 insteadOf 改写（pod template 缺 git-cdn gitconfig 注入）"; exit 1; }
          git clone --depth 1 https://github.com/ascend-gha-runners/test /tmp/t \
            || { echo "FAIL: 经 git-cdn 克隆失败"; exit 1; }
          ls /tmp/t/.github/workflows
          echo "PASS: git-cdn 克隆成功"

      - name: PyPI 缓存（80：X-Pypi-Cache MISS→HIT + pip install）
        run: |
          INDEX="http://$CACHE/pypi/simple"
          h1=$(curl -sI "$INDEX/six/" | grep -i x-pypi-cache | tr -d '\r' | awk '{print $2}')
          h2=$(curl -sI "$INDEX/six/" | grep -i x-pypi-cache | tr -d '\r' | awk '{print $2}')
          echo "first=$h1 second=$h2"
          [ -n "$h1" ] || { echo "FAIL: 无 X-Pypi-Cache 头，请求未经过缓存（另查 NO_PROXY 是否含 .svc.cluster.local）"; exit 1; }
          if [ "$h1" = "MISS" ]; then
            [ "$h2" = "HIT" ] || { echo "FAIL: MISS 后未命中"; exit 1; }
          fi
          pip install --index-url "$INDEX" --trusted-host "$CACHE" --no-input six \
            || { echo "FAIL: 经缓存 pip install 失败"; exit 1; }
          python -c "import six; print('six', six.__version__)"
          echo "PASS: PyPI 缓存链路正常"

      - name: crates.io 缓存（8085：sparse index + 下载）
        if: inputs.check-crates == true
        run: |
          CRATES="http://$CACHE:8085"
          dl=$(curl -s --max-time 20 "$CRATES/index/config.json" | grep -o '"dl": *"[^"]*"' | head -1)
          echo "$dl"
          echo "$dl" | grep -q "$CACHE:8085" \
            || { echo "FAIL: config.json dl 未改写到缓存"; exit 1; }
          h1=$(curl -s -o /dev/null -D - --max-time 60 "$CRATES/api/v1/crates/anyhow/1.0.75/download" | grep -i x-crates-cache | tr -d '\r' | awk '{print $2}')
          h2=$(curl -s -o /dev/null -D - --max-time 60 "$CRATES/api/v1/crates/anyhow/1.0.75/download" | grep -i x-crates-cache | tr -d '\r' | awk '{print $2}')
          echo "first=$h1 second=$h2"
          [ -n "$h1" ] || { echo "FAIL: 无 X-Crates-Cache 头"; exit 1; }
          if [ "$h1" = "MISS" ]; then
            [ "$h2" = "HIT" ] || { echo "FAIL: MISS 后未 HIT"; exit 1; }
          fi
          echo "PASS: crates 缓存链路正常"

      - name: 包缓存端口探针（8081 deb / 8082 rustup / 8084 go）
        run: |
          # 三端口均为缓存反代，能返回任意 HTTP 状态码即证明链路可用；
          # 根路径语义随上游而异，此处不断言具体码值（403/404 也算可达）
          fail=0
          for p in 8081 8082 8084; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "http://$CACHE:$p/")
            echo "INFO: 端口 $p → HTTP ${code:-000}"
            case "$code" in
              000|''|5*) echo "FAIL: 包缓存端口 $p 不可用"; fail=1 ;;
            esac
          done
          [ "$fail" -eq 0 ] || exit 1
          echo "PASS: 8081/8082/8084 均可达"

      - name: yum/dnf 缓存探针（8083，信息项）
        continue-on-error: true
        run: |
          sed -Ei 's@https?://(repo\.huaweicloud\.com/openeuler|repo\.openeuler\.org|mirrors\.openeuler\.org)@http://cache-service.nginx-pypi-cache.svc.cluster.local:8083@g' /etc/yum.repos.d/*.repo 2>/dev/null || true
          dnf clean all >/dev/null 2>&1 && dnf makecache >/dev/null 2>&1 && echo "INFO: yum 缓存链路可用" || echo "INFO: yum 探针未通过（镜像源格式差异），不阻塞"

      - name: squid 正向代理（3128：出网 + registry pull-through）
        run: |
          # -k 仅绕过 squid 自签 CA；生产 job 由 pod template 注入 squid-ca-cert 信任
          code=$(curl -sk -x "http://$SQUID" -o /dev/null -w '%{http_code}' --max-time 30 https://www.baidu.com)
          echo "baidu.com 经代理 → $code"
          [ "$code" = "200" ] || { echo "FAIL: 经 squid 代理出网失败（HTTP ${code:-000}）"; exit 1; }
          reg=$(curl -sk -x "http://$SQUID" -o /dev/null -w '%{http_code}' --max-time 30 https://registry-1.docker.io/v2/)
          echo "registry-1.docker.io/v2/ 经代理 → $reg"
          [ "$reg" = "401" ] || { echo "FAIL: docker registry 经代理异常（HTTP ${reg:-000}，期望 401）"; exit 1; }
          curl -sk -x "http://$SQUID" -o /dev/null --max-time 30 https://github.com \
            && echo "INFO: github.com 经代理可达" || echo "INFO: github.com 经代理本次不可达（波动不阻塞，git 克隆走 git-cdn）"
          echo "PASS: squid 代理出网 + registry 链路正常"

      - name: buildkitd（按架构 TCP + TLS）
        run: |
          case "$(uname -m)" in
            aarch64) BK=buildkitd-arm64-service.buildkitd ;;
            x86_64)  BK=buildkitd-amd64-service.buildkitd ;;
            *) echo "FAIL: 未知架构 $(uname -m)"; exit 1 ;;
          esac
          timeout 5 bash -c "</dev/tcp/$BK/1234" \
            || { echo "FAIL: buildkitd $BK:1234 TCP 不可达"; exit 1; }
          echo "PASS: buildkitd（$BK）TCP 可达"
          # 客户端证书由 Vault 注入生产 job，此处仅验证服务端 TLS 证书可见
          if command -v openssl >/dev/null 2>&1 \
            && echo | openssl s_client -connect "$BK:1234" 2>/dev/null | grep -q "BEGIN CERTIFICATE"; then
            echo "INFO: buildkitd 服务端 TLS 证书可见"
          else
            echo "WARN: 未读到服务端证书（openssl 缺失或握手被拒），TCP 已确认可达"
          fi

      - name: vault（8200 健康检查）
        run: |
          resp=$(curl -sk --max-time 10 -w '\n%{http_code}' https://vault.vault.svc:8200/v1/sys/health)
          code=$(printf '%s' "$resp" | tail -n 1)
          if [ "$code" = "000" ] || [ -z "$code" ]; then
            echo "INFO: https 探测失败，改用 http 重试"
            resp=$(curl -s --max-time 10 -w '\n%{http_code}' http://vault.vault.svc:8200/v1/sys/health)
            code=$(printf '%s' "$resp" | tail -n 1)
          fi
          printf '%s\n' "$(printf '%s' "$resp" | sed '$d')"
          case "$code" in
            200) echo "PASS: vault 健康（initialized & unsealed）" ;;
            429|472|473) echo "WARN: vault 可达但非 active（HTTP $code，standby），人工确认"; exit 0 ;;
            *) echo "FAIL: vault 健康检查异常（HTTP ${code:-000}）"; exit 1 ;;
          esac
