name: arc-fedsched e2e (1980)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: linux-aarch64-1980-1-lab
    timeout-minutes: 30
    container:
      image: swr.cn-north-12.myhuaweicloud.com/atlas_inference/cann:9.2.0_20260928212200-910b-ubuntu22.04-py3.12
    steps:
      - name: where am i
        run: |
          case "$NODE_NAME" in
            179.*|192.168.9.*|10.0.254.*|ecs-k8s-*|ascend*|ai-910b-*) CLUSTER="karc" ;;
            172.16.0.*)  CLUSTER="test1" ;;
            172.16.10.*) CLUSTER="test2" ;;
            *)           CLUSTER="unknown" ;;
          esac
          echo "::notice::ARC-FEDSCHED 1980 RUNNER CLUSTER = ${CLUSTER} (node=${NODE_NAME})"
          echo "============================================================"
          echo "  ARC-FEDSCHED 1980 CLUSTER : ${CLUSTER}"
          echo "  node                       : ${NODE_NAME}"
          echo "  pod                        : ${POD_NAMESPACE}/${POD_NAME}"
          echo "  pod ip                     : $(hostname -I 2>/dev/null | awk '{print $1}')"
          echo "============================================================"

      - name: npu info
        run: npu-smi info
