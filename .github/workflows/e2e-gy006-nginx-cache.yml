name: e2e-gy006-nginx-cache
# 验证 runner 流量经过集群内 nginx-pypi-cache（PR ascend-ci-deployment#1553
# 多级回源：huaweicloud→USTC→NJU→official），对应 backlog#2075 的高可用能力。
# 5xx fallback 由 ascend-ci-deployment 的 nginx-cache-test 单测回归覆盖，
# 本 workflow 验证线上缓存链路 + 404 真实回源。
on:
  workflow_dispatch:

jobs:
  pypi-cache:
    runs-on: ["linux-aarch64-a2-1", "gy-006"]
    timeout-minutes: 60
    container:
      image: swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/cann:8.2.rc1.alpha003-910b-openeuler22.03-py3.11
    env:
      INDEX: http://cache-service.nginx-pypi-cache.svc.cluster.local/pypi/simple
    steps:
      - name: 缓存在请求路径上（X-Pypi-Cache 头）
        run: |
          h1=$(curl -sI "$INDEX/six/" | grep -i x-pypi-cache | tr -d '\r' | awk '{print $2}')
          h2=$(curl -sI "$INDEX/six/" | grep -i x-pypi-cache | tr -d '\r' | awk '{print $2}')
          echo "first=$h1 second=$h2"
          [ -n "$h1" ] || { echo "FAIL: 响应无 X-Pypi-Cache 头，请求未经过缓存"; exit 1; }
          if [ "$h1" = "MISS" ]; then
            [ "$h2" = "HIT" ] || { echo "FAIL: MISS 后未命中"; exit 1; }
          fi
          echo "PASS: 请求经过 nginx-pypi-cache（$h1 → $h2）"

      - name: 经缓存 pip install
        run: |
          pip install --index-url "$INDEX" --trusted-host \
            cache-service.nginx-pypi-cache.svc.cluster.local --no-input six \
            || { echo "FAIL: pip install 失败"; exit 1; }
          python -c "import six; print('six', six.__version__)"
          echo "PASS: 经缓存安装成功"

      - name: 404 回源确定性断言（X-Cache-Tier / 直连404+缓存200）
        run: |
          bogus="e2e-nonexistent-pkg-${GITHUB_RUN_ID}"
          dcode=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 \
            "https://repo.huaweicloud.com/repository/pypi/simple/$bogus/")
          echo "bogus=$bogus direct-huaweicloud: $dcode"
          [ "$dcode" = "404" ] || { echo "FAIL: 直接 huaweicloud 未返回 404"; exit 1; }

          vcode=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$INDEX/$bogus/")
          served=$(curl -sI --max-time 30 "$INDEX/$bogus/" | grep -i x-cache-tier | tr -d '\r' | awk '{print $2}')
          echo "via-cache: $vcode, X-Cache-Tier: ${served:-<absent>}"

          if [ -n "$served" ]; then
            # X-Cache-Tier 带 always：即便最终 404，也证明请求走过 primary→fallback
            echo "$served" | grep -qE "pypi-org|ustc|nju" \
              && { echo "PASS: 回退链确定性成立（最终 $vcode，由 $served 服务）"; exit 0; } \
              || { echo "FAIL: X-Cache-Tier=$served 不是回源层级"; exit 1; }
          fi

          # X-Cache-Tier 未部署（ascend-ci-deployment#1672）：退回真实包探测
          echo "INFO: X-Cache-Tier 未上线，尝试真实包回源探测"
          cands=$(curl -s --max-time 20 https://pypi.org/rss/updates.xml \
            | grep -oE '<title>[^<]+</title>' | sed -E 's#</?title>##g; s# .*##' | head -50)
          hit=""
          for pkg in $cands; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 \
              "https://repo.huaweicloud.com/repository/pypi/simple/$pkg/")
            [ "$code" = "404" ] && { hit=$pkg; break; }
          done
          if [ -z "$hit" ]; then
            echo "WARN: 候选包均已被 huaweicloud 同步，本轮无法构造回源场景（不判定失败）"
            exit 0
          fi
          ccode=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$INDEX/$hit/")
          [ "$ccode" = "200" ] || { echo "FAIL: 缓存未回源 (got $ccode)"; exit 1; }
          echo "PASS: 直连404+缓存200 确定回源（$hit）"

      - name: crates.io 缓存（8085，rsproxy 一级 index + USTC 一级下载）
        run: |
          CRATES=http://cache-service.nginx-pypi-cache.svc.cluster.local:8085
          # 1. config.json:一级 rsproxy 服务,dl 改写回本缓存
          raw=$(curl -si --max-time 20 "$CRATES/index/config.json" | tr -d '\r')
          tier=$(printf '%s' "$raw" | grep -i '^x-cache-tier:' | awk '{print $2}')
          echo "config.json X-Cache-Tier: ${tier:-<absent>}"
          [ "$tier" = "rsproxy" ] || { echo "FAIL: config.json 未由 rsproxy 一级服务(got $tier)"; exit 1; }
          printf '%s' "$raw" | grep -q 'http://cache-service.nginx-pypi-cache.svc.cluster.local:8085/api/v1/crates' \
            || { echo "FAIL: config.json dl 未改写回缓存"; exit 1; }
          echo "PASS: config.json 由 rsproxy 服务且 dl 已改写"
          # 2. 下载:一级 USTC(200 直出可缓存),MISS→HIT
          h1=$(curl -s -o /dev/null -D - --max-time 60 "$CRATES/api/v1/crates/anyhow/1.0.75/download" | grep -i x-crates-cache | tr -d '\r' | awk '{print $2}')
          h2=$(curl -s -o /dev/null -D - --max-time 60 "$CRATES/api/v1/crates/anyhow/1.0.75/download" | grep -i x-crates-cache | tr -d '\r' | awk '{print $2}')
          echo "download first=$h1 second=$h2"
          [ -n "$h1" ] || { echo "FAIL: 无 X-Crates-Cache 头"; exit 1; }
          if [ "$h1" = "MISS" ]; then
            [ "$h2" = "HIT" ] || { echo "FAIL: MISS 后未 HIT"; exit 1; }
          fi
          echo "PASS: 下载缓存链路正常($h1 → $h2)"

      - name: crates 回退确定性断言（bogus crate → X-Cache-Tier）
        run: |
          CRATES=http://cache-service.nginx-pypi-cache.svc.cluster.local:8085
          bogus="e2e-bogus-crate-${GITHUB_RUN_ID}"
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 45 \
            --retry 3 --retry-delay 3 --retry-all-errors \
            "$CRATES/api/v1/crates/$bogus/1.0.0/download")
          served=$(curl -sI --max-time 45 --retry 3 --retry-delay 3 --retry-all-errors \
            "$CRATES/api/v1/crates/$bogus/1.0.0/download" \
            | grep -i x-cache-tier | tr -d '\r' | awk '{print $2}')
          echo "bogus-crate: $code, X-Cache-Tier: ${served:-<absent>}"
          if [ -n "$served" ]; then
            # 四级下载链任一层服务均属正常:rsproxy(403/404 直通)/ustc/aliyun/nju/官方
            echo "$served" | grep -qE "crates-official|ustc|nju|aliyun|rsproxy" \
              || { echo "FAIL: X-Cache-Tier=$served 非预期层级"; exit 1; }
            echo "PASS: crates 回退链确定性成立（最终 $code，由 $served 服务）"
          else
            echo "WARN: X-Cache-Tier 未上线（ascend-ci-deployment#1715 未部署），跳过回退断言"
          fi

      - name: PyTorch /whl/ 路由拆分验证（#1718 吸收）
        run: |
          WHL=http://cache-service.nginx-pypi-cache.svc.cluster.local/whl
          # torch 的索引页解析出一个 .whl 文件名
          whl_link=$(curl -s --max-time 20 "$WHL/torch/" | grep -oE 'href="[^"]*\.whl"' | head -1 | sed 's/href="//;s/"//')
          [ -n "$whl_link" ] || { echo "FAIL: torch 索引页无 .whl 链接"; exit 1; }
          fname=$(basename "$whl_link")
          echo "probe wheel: $fname"
          # 1. torch 的 .metadata 应 200(回源 download.pytorch.org,hash 与索引一致)
          mcode=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$WHL/torch/$fname.metadata")
          echo "torch .metadata: $mcode"
          [ "$mcode" = "200" ] || { echo "FAIL: torch .metadata 未回源 (got $mcode)"; exit 1; }
          # 2. 非 torch 的 .metadata 应 404(新行为:防止 R2 checksum 损坏)
          ncode=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$WHL/jinja2-3.1.6-py3-none-any.whl.metadata")
          echo "jinja2 .metadata: $ncode"
          [ "$ncode" = "404" ] || { echo "FAIL: 非 torch metadata 应 404 (got $ncode)"; exit 1; }
          # 3. .whl 应 200
          wcode=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 "$WHL/torch/$fname")
          [ "$wcode" = "200" ] || { echo "FAIL: whl got $wcode"; exit 1; }
          echo "PASS: /whl/ 路由拆分验证通过(metadata 回源 DPO,whl 走 R2,非 torch 404)"

      - name: 大 wheel 冷/热耗时对比（信息项）
        run: |
          time pip download --no-deps --index-url "$INDEX" --trusted-host \
            cache-service.nginx-pypi-cache.svc.cluster.local -d /tmp/dl numpy
          rm -rf /tmp/dl
          time pip download --no-deps --index-url "$INDEX" --trusted-host \
            cache-service.nginx-pypi-cache.svc.cluster.local -d /tmp/dl numpy
          echo "INFO: 二次下载应明显更快（缓存命中）"

      - name: 缓存卷容量检查（信息项，>85% 告警）
        run: |
          df -h /root/.cache | tail -1
          usage=$(df /root/.cache | tail -1 | awk '{print int($5)}')
          if [ "$usage" -ge 85 ]; then
            echo "WARN: 缓存卷使用率 ${usage}% ≥ 85%，请检查同 SFS 的其他租户或扩容（nginx 各缓存有独立 max_size，但卷满会 ENOSPC）"
          else
            echo "INFO: 缓存卷使用率 ${usage}%，正常"
          fi

      - name: yum/dnf 缓存探针（openeuler:8083，信息项）
        continue-on-error: true
        run: |
          sed -Ei 's@https?://(repo\.huaweicloud\.com/openeuler|repo\.openeuler\.org|mirrors\.openeuler\.org)@http://cache-service.nginx-pypi-cache.svc.cluster.local:8083@g' /etc/yum.repos.d/*.repo 2>/dev/null || true
          dnf clean all >/dev/null 2>&1 && dnf makecache >/dev/null 2>&1 && echo "INFO: yum 缓存链路可用" || echo "INFO: yum 探针未通过（镜像源格式差异），不阻塞"
