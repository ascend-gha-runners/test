name: e2e-feature-apt-cache
# 验证特性：APT 缓存服务（Port 8081）
# 文档来源：https://ascend-gha-runners.github.io/docs/feature/#apt-cache-port-8081
# 真实项目使用方式（参考 vllm-project/vllm-ascend CI 镜像构建与系统依赖安装）：
# 1. 配置 APT 镜像缓存源：
#    sed -Ei 's@(ports|archive).ubuntu.com@cache-service...:8081@g' /etc/apt/sources.list
# 2. 真实系统级包更新与安装：
#    apt-get update -y
#    apt-get install -y --no-install-recommends git zstd gcc cmake
# 3. 校验已安装工具链执行与版本

on:
  schedule:
    # 每天 UTC 18:00（北京时间 02:00，凌晨错峰）全集群 APT 缓存（Port 8081）验证
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      cluster:
        description: "目标集群 (all / gy-001 / wlcb-001 / sz-lab / gy-003 / gy-004 / gy-005 / gy-006 / cn12-001 / sh-001 / sh-002 / hk-001 / aiframework / mind-third-ci)"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - gy-001
          - wlcb-001
          - sz-lab
          - gy-003
          - gy-004
          - gy-005
          - gy-006
          - cn12-001
          - sh-001
          - sh-002
          - hk-001
          - aiframework
          - mind-third-ci
      runner_type:
        description: "Runner 类型 (all / cpu / npu)"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - cpu
          - npu
      cache_host:
        description: "集群内网 nginx-pypi-cache 服务域名"
        required: false
        default: "cache-service.nginx-pypi-cache.svc.cluster.local"
        type: string

jobs:
  matrix-setup:
    name: 解析集群 Runner 矩阵
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      count: ${{ steps.set-matrix.outputs.count }}
    steps:
      - name: 检出测试仓库
        uses: actions/checkout@v4

      - name: 解析 runners.json
        id: set-matrix
        run: |
          python3 -c '
          import json, os, sys

          config_file = ".github/config/runners.json"
          with open(config_file, "r") as fp:
              data = json.load(fp)

          runners = data.get("runners", [])
          target_cluster = "${{ inputs.cluster || 'all' }}"
          target_type = "${{ inputs.runner_type || 'all' }}"

          selected = []
          for r in runners:
              if target_cluster != "all":
                  if r.get("cluster") != target_cluster and not (target_cluster in ("wlcb", "wlcb-001") and r.get("cluster") in ("wlcb", "wlcb-001")):
                      continue
              if target_type != "all" and r.get("type") != target_type:
                  continue
              selected.append(r)

          if not selected and target_cluster != "all":
              for r in runners:
                  if r.get("cluster") == target_cluster or (target_cluster in ("wlcb", "wlcb-001") and r.get("cluster") in ("wlcb", "wlcb-001")):
                      selected.append(r)

          if not selected:
              print(f"Error: No runners matched filter (cluster={target_cluster}, type={target_type})", file=sys.stderr)
              sys.exit(1)

          matrix_json = json.dumps({"include": selected})
          print(f"Selected {len(selected)} runners: {matrix_json}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as gh_out:
              gh_out.write(f"matrix={matrix_json}\n")
              gh_out.write(f"count={len(selected)}\n")
          '

  run-apt-cache-e2e:
    name: "${{ matrix.name }} [${{ matrix.cluster }}]"
    needs: matrix-setup
    runs-on: ${{ matrix.labels }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix-setup.outputs.matrix) }}
    container:
      image: swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/cann:9.0.0-a3-ubuntu22.04-py3.12
    env:
      DEBIAN_FRONTEND: noninteractive
      CACHE_HOST: ${{ inputs.cache_host || 'cache-service.nginx-pypi-cache.svc.cluster.local' }}
    steps:
      - name: 基础环境与操作系统诊断
        run: |
          echo "=== 节点信息 ==="
          echo "Cluster: ${{ matrix.cluster }}"
          echo "Runner:  ${{ matrix.name }}"
          echo "Arch:    $(uname -m)"
          cat /etc/os-release | grep PRETTY_NAME || true

      - name: 【基础功能】1. 探测内网 APT 缓存端口（8081）连通性
        run: |
          echo "=== 探测 APT 缓存服务 (8081) ==="
          curl -sI --connect-timeout 5 "http://${CACHE_HOST}:8081" || echo "Note: Port 8081 root index may close or redirect, proceeding to apt repository test"

      - name: 【用户视角场景】2. 按照真实项目规范配置 Ubuntu APT 源指向集群内网缓存
        id: source-config
        run: |
          echo "=== 替换 /etc/apt/sources.list 指向 8081 缓存 ==="
          sed -Ei "s@(ports|archive|security).ubuntu.com@${CACHE_HOST}:8081@g" /etc/apt/sources.list
          for source in /etc/apt/sources.list.d/*.list; do
            if [ -f "$source" ]; then
              sed -Ei "s@(ports|archive|security).ubuntu.com@${CACHE_HOST}:8081@g" "$source"
            fi
          done
          echo "=== sources.list 校验 ==="
          grep -F "${CACHE_HOST}:8081" /etc/apt/sources.list
          mkdir -p /tmp/apt-primary-empty
          set -- /etc/apt/sources.list
          for source in /etc/apt/sources.list.d/*.list; do
            if [ -f "$source" ]; then set -- "$@" "$source"; fi
          done
          grep -hE '^deb .*' "$@" | grep -F "http://${CACHE_HOST}:8081" > /tmp/apt-primary.sources
          test -s /tmp/apt-primary.sources

      - name: 【用户视角场景】3. 经内网缓存真实执行 apt-get update
        id: primary-index
        run: |
          echo "=== 执行 apt-get update -y ==="
          rm -rf /var/lib/apt/lists/*
          apt-get -o Dir::Etc::sourcelist=/tmp/apt-primary.sources -o Dir::Etc::sourceparts=/tmp/apt-primary-empty -o APT::Update::Error-Mode=any update -y

      - name: 【用户视角场景】4. 经内网缓存真实安装核心编译工具链（vLLM-Ascend 依赖）
        id: primary-download
        run: |
          echo "=== 安装构建依赖 (git, zstd, gcc, cmake) ==="
          set -eu
          apt-get clean
          apt-get -o Dir::Etc::sourcelist=/tmp/apt-primary.sources -o Dir::Etc::sourceparts=/tmp/apt-primary-empty install -y --reinstall --no-install-recommends git zstd gcc cmake > /tmp/apt-install.log 2>&1
          cat /tmp/apt-install.log
          grep -F "http://${CACHE_HOST}:8081" /tmp/apt-install.log | grep -E '^Get:'

      - name: 【用户视角场景】5. 验证已安装工具链及二进制可执行
        id: runtime
        run: |
          echo "=== 验证工具链执行与版本 ==="
          git --version
          zstd --version
          gcc --version
          cmake --version
          echo "✓ APT Cache 8081 feature verified successfully on ${{ matrix.cluster }} (${{ matrix.name }})!"

      - name: 【基础功能】6. 异常场景：404 虚构 deb 包探测与定位异常断言
        id: protocol-negative
        run: |
          echo "=== 探测 8081 端点虚构 deb 包，验证 HTTP 404 返回 ==="
          bogus_deb="e2e-bogus-pkg-${GITHUB_RUN_ID}.deb"
          prefix="ubuntu"
          if [ "$(uname -m)" = "aarch64" ]; then
            prefix="ubuntu-ports"
          fi
          status=$(curl -sS --max-time 45 -D /tmp/apt-bogus.headers -o /tmp/apt-bogus.body -w '%{http_code}' "http://${CACHE_HOST}:8081/${prefix}/pool/main/b/${bogus_deb}")
          head -n 10 /tmp/apt-bogus.headers
          if [ "$status" = "404" ]; then
            echo "✓ 8081 虚构 deb 请求正常返回 404 Not Found"
          else
            echo "::error::8081 端点未能返回 404 响应"
            exit 1
          fi

          echo "=== 尝试安装虚构包，验证客户端正确报错退出 ==="
          apt-get install -y --dry-run "e2e-nonexistent-deb-${GITHUB_RUN_ID}" > /tmp/apt_err 2>&1 && installed=true || installed=false
          cat /tmp/apt_err
          if [ "$installed" = "true" ]; then
            echo "::error::虚构包竟然安装成功，断言失败!"
            exit 1
          fi
          echo "✓ apt-get 探测到不存在的包并成功捕获异常:"
          grep -E "Unable to locate package|无法定位软件包" /tmp/apt_err

      - name: 【基础功能】7. 异常场景：客户端容灾降级（故障源超时跳过与有效源兜底）
        id: client-fallback
        run: |
          set -eu
          export LC_ALL=C
          testdir=$(mktemp -d /tmp/apt-failover.XXXXXX)
          trap 'rm -rf "$testdir"' EXIT
          chmod 755 "$testdir"
          mkdir -p "$testdir/lists/partial" "$testdir/archives/partial" "$testdir/empty"
          # Only reviewed internal sources; no pre-existing indexes or package cache.
          cp /tmp/apt-primary.sources "$testdir/sources.list"
          test -s "$testdir/sources.list"
          echo 'deb [trusted=yes] http://127.0.0.1:59999/ubuntu jammy main' >> "$testdir/sources.list"
          set -- -o "Dir::Etc::sourcelist=$testdir/sources.list" -o "Dir::Etc::sourceparts=$testdir/empty" -o "Dir::State::lists=$testdir/lists" -o "Dir::Cache::archives=$testdir/archives" -o Acquire::http::Timeout=2 -o Acquire::Retries=1
          # Error-Mode=any is deliberately NOT used here: this client scenario tolerates
          # the faulty source, but must still fetch valid indexes and package bytes.
          apt-get "$@" update > "$testdir/update.log" 2>&1
          cat "$testdir/update.log"
          grep -F '127.0.0.1:59999' "$testdir/update.log" | grep -E 'Failed to fetch|Could not connect|Unable to connect'
          grep -F "http://${CACHE_HOST}:8081" "$testdir/update.log" | grep -E '^Get:'
          find "$testdir/lists" -type f -name '*_Packages*' -size +0c | grep -q .
          apt-get "$@" install -y --download-only --reinstall --no-install-recommends git > "$testdir/download.log" 2>&1
          cat "$testdir/download.log"
          grep -F "http://${CACHE_HOST}:8081" "$testdir/download.log" | grep -E '^Get:.* git '
          find "$testdir/archives" -type f -name 'git_*.deb' -size +0c | grep -q .
          echo "✓ APT 客户端故障源容错：有效索引与内网包下载均已验证"

      - name: 硬断言结果汇总（客户端备用源不代表 nginx 上游切换）
        if: ${{ always() }}
        env:
          HARD_STEPS: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PY'
          import json, os
          steps = json.loads(os.environ['HARD_STEPS'])
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('### APT hard assertions\n| Check | Result |\n|---|---|\n')
              for name in ('source-config', 'primary-index', 'primary-download', 'runtime', 'protocol-negative', 'client-fallback'):
                  outcome = steps.get(name, {}).get('outcome', 'skipped')
                  result = {'success': 'pass', 'failure': 'fail'}.get(outcome, 'not_verified')
                  summary.write(f'| {name} | {result} |\n')
              summary.write('Internal-only APT sources; client fallback is not nginx upstream failover evidence.\n')
          PY
          rm -rf /tmp/apt-primary.sources /tmp/apt-primary-empty
